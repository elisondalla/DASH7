<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Dashboard de Chamados - Grupo Koch</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f6f9;color:#1a1a1a;font-family:'Segoe UI',Arial,sans-serif;line-height:1.5;padding:24px 28px}
.header{text-align:center;margin-bottom:24px;padding-bottom:18px;border-bottom:3px solid #1B2A5C}
.header h1{font-size:24px;text-transform:uppercase;letter-spacing:3px;font-weight:700;color:#1B2A5C;margin-bottom:6px}
.header .periodo{display:inline-block;background:#1B2A5C;color:#fff;padding:4px 16px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:2px}
.abas{display:flex;gap:4px;margin-bottom:22px;flex-wrap:wrap;border-bottom:2px solid #E5E8EE}
.aba{background:transparent;border:none;border-bottom:3px solid transparent;color:#64748b;padding:12px 18px;font-size:12px;font-weight:700;text-transform:uppercase;cursor:pointer;font-family:inherit;position:relative;z-index:1000;transition:all .15s}
.aba:hover{color:#1B2A5C;background:#F8FAFC}
.aba.ativa{color:#1B2A5C;border-bottom-color:#1B2A5C;font-weight:800}
.aba-pcm.ativa{color:#7c3aed;border-bottom-color:#7c3aed}
.aba-extra.ativa{color:#f97316;border-bottom-color:#f97316}
.filtro-data{background:#fff;border-radius:12px;padding:16px 20px;box-shadow:0 2px 8px rgba(27,42,92,.06);border:1px solid #E8EBF0;margin-bottom:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:1}
.filtro-data label{font-size:11px;font-weight:700;text-transform:uppercase;color:#64748b}
.filtro-data input{padding:8px 12px;border:1.5px solid #D6DBE3;border-radius:8px;font-family:inherit;font-size:13px;color:#1B2A5C}
.filtro-data button{background:#1B2A5C;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer;font-family:inherit}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:3px;font-weight:700;color:#1B2A5C;margin:24px 0 16px;padding-bottom:10px;border-bottom:1px solid #E5E8EE;display:flex;justify-content:space-between}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(27,42,92,.06);border:1px solid #E8EBF0;border-left:4px solid #1B2A5C}

.painel-titulo.preventiva{background:#6d28d9;color:#fff}
.painel-bloco{background:#F8FAFC;padding:16px;border-radius:12px;margin-bottom:20px;border:1px solid #E8EBF0}
.grafico-card{background:#fff;border-radius:14px;padding:24px;margin-bottom:22px;border:1px solid #E8EBF0}
.grafico-titulo{font-size:13px;font-weight:700;color:#1B2A5C;margin-bottom:18px;text-transform:uppercase}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}

.cat-card.vermelho{border-top-color:#D9182D}
.cat-nome{font-size:15px;font-weight:800;color:#1B2A5C;text-transform:uppercase;margin-bottom:14px}
.cat-info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #F0F3F8}
.cat-info{text-align:center}
.cat-info-label{font-size:9px;color:#94a3b8;text-transform:uppercase;font-weight:700}
.cat-info-valor{font-size:20px;font-weight:800;color:#1a1a1a}
.cat-progresso{display:flex;justify-content:space-between;align-items:center}
.badge{font-size:13px;font-weight:800;padding:5px 14px;border-radius:20px}
.badge.verde{background:#E8F8EF;color:#16A34A}
.badge.amarelo{background:#FEF7E0;color:#A16207}
.badge.vermelho{background:#FEF0F0;color:#D9182D}
.tabela{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px;background:#fff;border-radius:10px;overflow:hidden}
.tabela thead{background:#1B2A5C;color:#fff}
.tabela th{padding:11px 14px;text-align:left;font-size:10px;text-transform:uppercase;font-weight:700}
.tabela td{padding:10px 14px;border-bottom:1px solid #F0F3F8}
.tabela tr:hover td{background:#F8FAFC}
.tabela .rank{font-weight:800;color:#1B2A5C}
.tabela .rank.ouro{color:#CA8A04}
.tabela .rank.prata{color:#64748b}
.tabela .rank.bronze{color:#b45309}
.tabela .num{text-align:center;font-weight:700}
.tabela .taxa{text-align:center}
.tabela .taxa span{padding:3px 10px;border-radius:12px;font-weight:800}
.tabela .taxa span.verde{background:#E8F8EF;color:#16A34A}
.tabela .taxa span.amarelo{background:#FEF7E0;color:#A16207}
.tabela .taxa span.vermelho{background:#FEF0F0;color:#D9182D}
.tabela .nome-clicavel{color:#1B2A5C;font-weight:700;cursor:pointer;text-decoration:underline}
.btn-voltar{background:#fff;color:#1B2A5C;border:1.5px solid #D6DBE3;padding:8px 18px;border-radius:8px;font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer;margin-bottom:18px}
.btn-voltar:hover{background:#1B2A5C;color:#fff}
.detalhe-titulo{font-size:22px;font-weight:800;color:#1B2A5C;text-transform:uppercase;margin-bottom:20px}
.bloco-lojas{background:#F8FAFC;border-radius:10px;padding:14px;margin-bottom:14px;border:1px solid #E8EBF0}
.bloco-titulo{font-size:10px;font-weight:800;color:#1B2A5C;margin-bottom:10px;border-bottom:1px solid #E2E8F0;padding-bottom:6px;text-transform:uppercase}
.loja-tag{display:inline-block;background:#F1F5F9;color:#1B2A5C;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;margin:2px;border:1px solid #E2E8F0}
.loja-tag.aberto{background:#FEF0F0;color:#D9182D}
.loading{text-align:center;padding:60px;color:#94a3b8}
.erro{background:#FEF0F0;border:2px solid #D9182D;color:#D9182D;padding:16px;border-radius:10px;margin:20px auto;max-width:900px;text-align:center;font-weight:700}
.rodape{text-align:center;margin-top:44px;padding-top:20px;border-top:1px solid #E5E8EE;color:#94a3b8;font-size:10px;text-transform:uppercase}
@media (max-width:1000px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.cat-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="header">
  <div class="eyebrow">GRUPO KOCH</div>
  <h1>Dashboard de Chamados</h1>
  <div class="periodo">SETEMBRO/26</div>
</div>
<div id="conteudo">
  <div class="loading">Carregando...</div>
</div>
<div class="rodape">Grupo Koch &bull; Dashboard de Chamados</div>
<script>
// ============================================================
// MAPAS E CONFIGURAÇÕES
// ============================================================
const SUBGERENTES = {
  "RAONI": { regional: "DIEGO", lojas: ["26","28","35","39","42","45","50","51","59","64","65","71","76","77","92","94","103","104","107","111"] },
  "MARCOS": { regional: "CICERO", lojas: ["5","22","25","30","32","33","34","36","40","43","46","49","63","72","74","80","89","100","106","110"] },
  "URIEL": { regional: "JEFFERSON", lojas: ["5","22","25","30","32","33","34","36","40","43","46","49","63","72","74","80","89","100","106","110"] },
  "JAMISSON": { regional: "ADEMIR", lojas: ["4","6","7","9","14","15","18","31","37","41","52","69","82","95","99","CD"] },
  "JUVERLEI": { regional: "LEANDRO", lojas: ["1","2","10","13","24","29","53","56","68","73","78","83","88","90","91","96","105","800","889","CD 2"] },
  "CRISTIANO": { regional: "EVERTON", lojas: ["47","54","57","58","60","61","62","66","67","70","75","79","84","85","86","93","112"] }
};

const LOJA_PARA_SUBGERENTE = {};
Object.entries(SUBGERENTES).forEach(([sub, info]) => {
  info.lojas.forEach(loja => {
    const norm = String(loja).toUpperCase().trim().replace(/^LOJA\s+/, "");
    const chave = /^\d+$/.test(norm) ? String(parseInt(norm, 10)) : norm;
    if (!LOJA_PARA_SUBGERENTE[chave]) LOJA_PARA_SUBGERENTE[chave] = [];
    if (!LOJA_PARA_SUBGERENTE[chave].includes(sub)) LOJA_PARA_SUBGERENTE[chave].push(sub);
  });
});

const REGIONAL_PARA_SUBGERENTE = {};
Object.entries(SUBGERENTES).forEach(([sub, info]) => { REGIONAL_PARA_SUBGERENTE[info.regional] = sub; });

const MAPA_CATEGORIAS = [
  { match: "PCM", cat: "PCM", pcm: true }, { match: "MATHEUS PCM", cat: "PCM", pcm: true }, { match: "GABRIELA PCM", cat: "PCM", pcm: true }, { match: "AMANDA PCM", cat: "PCM", pcm: true }, { match: "LUAN PCM", cat: "PCM", pcm: true }, { match: "ANNE PCM", cat: "PCM", pcm: true }, { match: "ROBERTA BONOTTO", cat: "PCM", pcm: true },
  { match: "EXTRAS", cat: "Extras", extra: true },
  { match: "SAS EMPILHADEIRAS", cat: "Empilhadeiras" }, { match: "TRANSPOTECH", cat: "Empilhadeiras" },
  { match: "CRISTIANO PALETEIRAS", cat: "Paleteiras" },
  { match: "RDL CARRINHOS", cat: "Carrinhos" }, { match: "CRISTIANO COLETA", cat: "Carrinhos" }, { match: "JOEL SOARES COLETA", cat: "Carrinhos" }, { match: "JOSÉ RENATO COLETA", cat: "Carrinhos" }, { match: "JOSE RENATO COLETA", cat: "Carrinhos" }, { match: "LENO COLETA", cat: "Carrinhos" }, { match: "OSVALDO COLETA", cat: "Carrinhos" }, { match: "INOVE TRANSPORTES", cat: "Carrinhos" }, { match: "GLAUCO", cat: "Carrinhos" },
  { match: "RENOFLEX", cat: "Mobiliário" }, { match: "LUCIANO CADEIRAS", cat: "Mobiliário" },
  { match: "MANTEC", cat: "Padaria" }, { match: "COLDSERV", cat: "Câmaras" },
  { match: "LUCFRIO CLIMATIZAÇÃO BARRA VELHA", cat: "Climatização" }, { match: "LUCFRIO CLIMATIZAÇÃO JOINVILLE", cat: "Climatização" }, { match: "CLIMATEC CLIMATIZAÇÃO ITAPEMA", cat: "Climatização" }, { match: "CLIMATEC CLIMATIZAÇÃO TIJUCAS", cat: "Climatização" }, { match: "GILBERTO CLIMATIZAÇÃO BLUMENAU", cat: "Climatização" }, { match: "ABMAEL CLIMATIZAÇÃO", cat: "Climatização" },
  { match: "WOLF REFRIGERAÇÃO", cat: "Refrigeração" }, { match: "ELOS TECH REFRIGERAÇÃO", cat: "Refrigeração" }, { match: "MACFRIO REFRIGERAÇÃO", cat: "Refrigeração" }, { match: "ADEMIR REFRIGERAÇÃO", cat: "Refrigeração" }, { match: "DANIEL ELETROMUNDO REFRIGERAÇÃO", cat: "Refrigeração" }, { match: "DIEGO ELETROMUNDO REFRIGERAÇÃO", cat: "Refrigeração" }, { match: "RF ROBSOM REFRIGERAÇÃO 1", cat: "Refrigeração" }, { match: "RF ROBSOM REFRIGERAÇÃO 2", cat: "Refrigeração" }, { match: "ROBSOM PREVENTIVAS", cat: "Refrigeração" }, { match: "JHONATHAN BITTENCOURT", cat: "Refrigeração" }, { match: "RAFAEL BITTENCOURT", cat: "Refrigeração" },
  { match: "LUCIANO ELETROMUNDO", cat: "Elétrica" }, { match: "ADEMIR ELÉTRICA", cat: "Elétrica" }, { match: "MARCOS ELETROMUNDO", cat: "Elétrica" }, { match: "DIEGO ELETROMUNDO", cat: "Elétrica" }, { match: "FILIPE ELETROMUNDO", cat: "Elétrica" }, { match: "NSC ELÉTRICA", cat: "Elétrica" }, { match: "NSC EL", cat: "Elétrica" }, { match: "RUDINEI NOBREAKS", cat: "Elétrica" }, { match: "TIJUELETRO", cat: "Elétrica" },
  { match: "ALEMÃO CALHAS", cat: "Telhados" }, { match: "ISRAEL JARDIM", cat: "Jardim" }, { match: "JASMIM JARDINAGEM", cat: "Jardim" }, { match: "JOEL GERADORES", cat: "Geradores" }, { match: "LUCIANO GERADORES", cat: "Geradores" },
  { match: "DOLIRIO PREDIAL", cat: "Predial" }, { match: "MARCIO PREDIAL", cat: "Predial" }, { match: "VALDIR LIMA PREDIAL", cat: "Predial" }, { match: "RODRIGO PREDIAL", cat: "Predial" }, { match: "DJA PREDIAL", cat: "Predial" }, { match: "LEONARDO PREDIAL", cat: "Predial" }, { match: "AMARAL PREDIAL", cat: "Predial" }, { match: "RENATO LIMA PREDIAL", cat: "Predial" },
  { match: "GS SERRALHERIA", cat: "Serralheria" }, { match: "DM SERRALHERIA", cat: "Serralheria" }, { match: "DOLIRIO SERRALHERIA", cat: "Serralheria" },
  { match: "REGIONAL", cat: "Regionais" }, { match: "SUBGERENTE", cat: "Regionais" }
];

// ============================================================
// FUNÇÕES AUXILIARES
// ============================================================
function normalizar(txt) { return String(txt || "").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim(); }
function normalizarLoja(loja) { if (!loja) return ""; let l = String(loja).toUpperCase().trim().replace(/^LOJA\s+/, ""); if (/^\d+$/.test(l)) l = String(parseInt(l, 10)); if (l === "CD" || l === "CD 1" || l === "CD1") l = "CD"; if (l === "CD 2" || l === "CD2") l = "CD 2"; if (l.includes("CP 800") || l === "800") l = "800"; if (l.includes("889")) l = "889"; if (l.includes("NAO IDENTIFICADO") || l.includes("NÃO IDENTIFICADO")) l = "107"; return l; }
function classificarAtendente(nome) { if (!nome) return { cat: "Outros", pcm: false, extra: false }; const n = normalizar(nome); for (const regra of MAPA_CATEGORIAS) { if (n.includes(normalizar(regra.match))) return { cat: regra.cat, pcm: !!regra.pcm, extra: !!regra.extra }; } return { cat: "Outros", pcm: false, extra: false }; }
function classificarStatus(s) { if (!s) return "aberto"; const x = String(s).toLowerCase(); if (x === "encerrado" || x.includes("decurso") || x.includes("fechado pelo")) return "fechado"; return "aberto"; }
function classificarTipo(t) { if (!t) return "corretiva"; return normalizar(t).startsWith("PREVENTIVO") ? "preventiva" : "corretiva"; }
function dataParaISO(s) { if (!s) return ""; const p = String(s).trim().split("/"); if (p.length !== 3) return ""; return `${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`; }
function calcularTaxa(t, f) { return t === 0 ? 0 : Math.round((f / t) * 100); }
function corTaxa(t) { return t >= 85 ? "verde" : (t >= 60 ? "amarelo" : "vermelho"); }
function medalha(p) { return p === 1 ? "1º" : p === 2 ? "2º" : p === 3 ? "3º" : p + "º"; }

function parseCSV(texto) {
  const linhas = []; let campo = "", linha = [], dentroAspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i], prox = texto[i + 1];
    if (c === '"') { if (dentroAspas && prox === '"') { campo += '"'; i++; } else dentroAspas = !dentroAspas; }
    else if (c === ',' && !dentroAspas) { linha.push(campo); campo = ""; }
    else if ((c === '\n' || c === '\r') && !dentroAspas) { if (c === '\r' && prox === '\n') i++; if (campo !== "" || linha.length > 0) { linha.push(campo); linhas.push(linha); linha = []; campo = ""; } }
    else { campo += c; }
  }
  if (campo !== "" || linha.length > 0) { linha.push(campo); linhas.push(linha); }
  return linhas;
}

let TODOS_CHAMADOS = [];
let CHAMADOS_FILTRADOS = [];
let ABA_ATUAL = "inicio";
let DATA_FILTRO = "";
let BUSCA_TEXTO = "";
let GRAFICOS = {};

function aplicarFiltros(chamados) {
  let f = chamados;
  if (DATA_FILTRO) f = f.filter(c => c.dataAbertISO === DATA_FILTRO || c.dataEncISO === DATA_FILTRO);
  if (BUSCA_TEXTO) f = f.filter(c => normalizar(c.atendente).includes(normalizar(BUSCA_TEXTO)));
  return f;
}

function agruparPor(chamados, chaveFn) {
  const map = new Map();
  chamados.forEach(c => {
    const k = chaveFn(c); if (!k || k === "Outros") return;
    if (!map.has(k)) map.set(k, { total: 0, fechados: 0, abertos: 0 });
    const g = map.get(k); g.total++; if (c.statusCls === "fechado") g.fechados++; else g.abertos++;
  });
  return Array.from(map.entries()).map(([nome, d]) => ({ nome, ...d, taxa: calcularTaxa(d.total, d.fechados) }));
}

function carregarDados() {
  const container = document.getElementById("conteudo");
  container.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:40px;box-shadow:0 4px 16px rgba(27,42,92,.08);border:1px solid #E8EBF0;text-align:center;max-width:640px;margin:40px auto;">
      <div style="font-size:20px;font-weight:800;color:#1B2A5C;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;">Selecione o arquivo CSV</div>
      <div style="font-size:13px;color:#64748b;margin-bottom:24px;line-height:1.6;">Escolha o arquivo <strong>chamados.csv</strong> na pasta do dashboard.</div>
      <input type="file" id="input-csv" accept=".csv" style="display:none;">
      <button id="btn-escolher" style="background:#1B2A5C;color:#fff;border:none;padding:14px 32px;border-radius:10px;font-size:13px;font-weight:700;text-transform:uppercase;cursor:pointer;font-family:inherit;">Escolher arquivo CSV</button>
    </div>
  `;
  const inputFile = document.getElementById("input-csv");
  document.getElementById("btn-escolher").onclick = () => inputFile.click();
  inputFile.onchange = (e) => {
    const arquivo = e.target.files[0]; if (!arquivo) return;
    const reader = new FileReader();
    reader.onload = (event) => { try { processarCSV(event.target.result); } catch (err) { container.innerHTML = `<div class="erro">Erro: ${err.message}</div>`; } };
    reader.readAsText(arquivo, "UTF-8");
  };
}

function processarCSV(texto) {
  const linhas = parseCSV(texto);
  const header = linhas[0].map(h => normalizar(h));
  const idx = { loja: header.indexOf("LOJA"), subgerente: header.indexOf("SUBGERENTE"), tipo: header.indexOf("TIPO DO CHAMADO"), atendente: header.indexOf("ATENDENTE"), dataAbert: header.findIndex(h => h.includes("DATA DE ABERTURA")), dataEncerr: header.findIndex(h => h.includes("DATA DA ENCERRAMENTO")), status: header.indexOf("STATUS"), titulo: header.findIndex(h => h.includes("TITULO")) };

  TODOS_CHAMADOS = [];
  for (let i = 1; i < linhas.length; i++) {
    const l = linhas[i]; if (!l || l.length < 2) continue;
    const atendente = (l[idx.atendente] || "").trim(); if (!atendente) continue;
    const tipoRaw = (l[idx.tipo] || "").trim();
    const tituloRaw = (l[idx.titulo] || "").trim();
    const loja = (l[idx.loja] || "").trim();
    const lojaNorm = normalizarLoja(loja);
    const cls = classificarAtendente(atendente);
    let catDoChamado = cls.cat;

    if (normalizar(tituloRaw).includes("JARDIM") || normalizar(tituloRaw).includes("JARDINAGEM")) { catDoChamado = "Jardim"; }

    let ehExtra = cls.extra;
    const nAt = normalizar(atendente);
    if (nAt.includes("REGIONAL") || nAt.includes("SUBGERENTE")) ehExtra = false;

    const subg = normalizar((l[idx.subgerente] || "").trim()) || (LOJA_PARA_SUBGERENTE[lojaNorm] ? LOJA_PARA_SUBGERENTE[lojaNorm][0] : "");

    TODOS_CHAMADOS.push({
      loja, lojaNorm, subg,
      atendente, tipo: classificarTipo(tipoRaw), status: (l[idx.status] || "").trim(), statusCls: classificarStatus(l[idx.status]),
      dataAbert: (l[idx.dataAbert] || "").trim(), dataEnc: (l[idx.dataEncerr] || "").trim(), dataAbertISO: dataParaISO(l[idx.dataAbert]), dataEncISO: dataParaISO(l[idx.dataEncerr]),
      categoria: catDoChamado, pcm: cls.pcm, extra: ehExtra
    });
  }
  CHAMADOS_FILTRADOS = TODOS_CHAMADOS.slice();
  document.getElementById("conteudo").innerHTML = "";
  renderizarAbas(); renderizarHome();
}
// ============================================================
// SISTEMA DE ABAS (A PROVA DE FALHAS)
// ============================================================
const ABAS = [
  { id: "inicio", label: "Início" },
  { id: "subgerentes", label: "Subgerentes" },
  { id: "regionais", label: "Regionais" },
  { id: "categorias", label: "Categorias" },
  { id: "pcm", label: "PCM", cls: "aba-pcm" },
  { id: "extras", label: "Extras", cls: "aba-extra" },
  { id: "outros", label: "Outros" }
];

// 1. Função que desenha a barra de abas
function renderizarAbas() {
  const div = document.getElementById("conteudo");
  const abas = document.createElement("div");
  abas.id = "abas-container";
  abas.className = "abas";
  
  ABAS.forEach(a => {
    const b = document.createElement("button");
    b.className = "aba" + (a.cls ? " " + a.cls : "");
    b.textContent = a.label;
    
    // O SEGREDO ESTÁ AQUI: onclick direto no elemento
    b.onclick = function() {
      trocarAba(a.id);
    };
    
    abas.appendChild(b);
  });
  
  div.innerHTML = "";
  div.appendChild(abas);
}

// 2. Função que muda de aba e reconstrói a tela
function trocarAba(abaId) {
  ABA_ATUAL = abaId;
  
  // 1. Reconstrói a barra de abas do zero (para aplicar a classe 'ativa')
  renderizarAbas();
  
  // 2. Pega o container do conteúdo (que agora só tem a barra de abas)
  const conteudo = document.getElementById("conteudo");
  
  // 3. Desenha o conteúdo específico da aba embaixo da barra
  if (abaId === "inicio") renderizarHome();
  else if (abaId === "subgerentes") renderizarListaGenerica("Subgerentes", agruparPor(CHAMADOS_FILTRADOS, c => c.subg), "subg");
  else if (abaId === "regionais") renderizarListaGenerica("Regionais", agruparPor(CHAMADOS_FILTRADOS.filter(c => normalizar(c.atendente).includes("REGIONAL")), c => c.atendente), "prest");
  else if (abaId === "categorias") renderizarGridCategorias();
  else if (abaId === "pcm") renderizarDetalheGenerico("PCM", CHAMADOS_FILTRADOS.filter(c => c.pcm), true);
  else if (abaId === "extras") renderizarDetalheGenerico("Extras", CHAMADOS_FILTRADOS.filter(c => c.extra || c.categoria === "Extras"), true);
  else if (abaId === "outros") renderizarDetalheGenerico("Outros", CHAMADOS_FILTRADOS.filter(c => c.categoria === "Outros"), true);
}

// ============================================================
// HOME (VISÃO GERAL E GRÁFICOS)
// ============================================================
function renderizarFiltro() {
  const wrap = document.createElement("div");
  wrap.className = "filtro-data";
  wrap.innerHTML = `
    <label>Data:</label>
    <input type="date" id="input-data" value="${DATA_FILTRO}">
    <button id="btn-aplicar">Aplicar</button>
    <label>Buscar:</label>
    <input type="text" id="input-busca" value="${BUSCA_TEXTO}" placeholder="Nome do prestador...">
    <button id="btn-buscar">Buscar</button>
  `;
  document.getElementById("conteudo").appendChild(wrap);
  
  document.getElementById("btn-aplicar").onclick = () => { 
    DATA_FILTRO = document.getElementById("input-data").value; 
    CHAMADOS_FILTRADOS = aplicarFiltros(TODOS_CHAMADOS); 
    trocarAba(ABA_ATUAL); 
  };
  
  document.getElementById("btn-buscar").onclick = () => { 
    BUSCA_TEXTO = document.getElementById("input-busca").value; 
    CHAMADOS_FILTRADOS = aplicarFiltros(TODOS_CHAMADOS); 
    trocarAba(ABA_ATUAL); 
  };
}

function renderizarHome() {
  const conteudo = document.getElementById("conteudo");
  renderizarFiltro();
  
  const k = { 
    total: CHAMADOS_FILTRADOS.length, 
    fechados: CHAMADOS_FILTRADOS.filter(c => c.statusCls === "fechado").length, 
    abertos: CHAMADOS_FILTRADOS.filter(c => c.statusCls === "aberto").length 
  };
  k.taxa = calcularTaxa(k.total, k.fechados);
  
  const fPrev = CHAMADOS_FILTRADOS.filter(c => c.tipo === "preventiva");
  const fCorr = CHAMADOS_FILTRADOS.filter(c => c.tipo === "corretiva");
  const pFech = fPrev.filter(c => c.statusCls === "fechado").length;
  const pAbert = fPrev.filter(c => c.statusCls === "aberto").length;
  const cFech = fCorr.filter(c => c.statusCls === "fechado").length;
  const cAbert = fCorr.filter(c => c.statusCls === "aberto").length;

  const divPainéis = document.createElement("div");
  divPainéis.innerHTML = `
    <div class="painel-bloco"><div class="painel-titulo geral">GERAL</div><div class="kpi-grid"><div class="kpi-card azul"><div class="kpi-label">Total</div><div class="kpi-valor">${k.total}</div></div><div class="kpi-card verde"><div class="kpi-label">Fechados</div><div class="kpi-valor">${k.fechados}</div></div><div class="kpi-card laranja"><div class="kpi-label">Em Atendimento</div><div class="kpi-valor">${k.abertos}</div></div><div class="kpi-card ${corTaxa(k.taxa)}"><div class="kpi-label">Taxa de Conclusão</div><div class="kpi-valor">${k.taxa}%</div></div></div></div>
    <div class="painel-bloco"><div class="painel-titulo corretiva">CORRETIVAS</div><div class="kpi-grid"><div class="kpi-card azul"><div class="kpi-label">Total</div><div class="kpi-valor">${fCorr.length}</div></div><div class="kpi-card verde"><div class="kpi-label">Fechados</div><div class="kpi-valor">${cFech}</div></div><div class="kpi-card laranja"><div class="kpi-label">Em Atendimento</div><div class="kpi-valor">${cAbert}</div></div><div class="kpi-card ${corTaxa(calcularTaxa(fCorr.length, cFech))}"><div class="kpi-label">Taxa</div><div class="kpi-valor">${calcularTaxa(fCorr.length, cFech)}%</div></div></div></div>
    <div class="painel-bloco"><div class="painel-titulo preventiva">PREVENTIVAS</div><div class="kpi-grid"><div class="kpi-card azul"><div class="kpi-label">Total</div><div class="kpi-valor">${fPrev.length}</div></div><div class="kpi-card verde"><div class="kpi-label">Fechados</div><div class="kpi-valor">${pFech}</div></div><div class="kpi-card laranja"><div class="kpi-label">Em Atendimento</div><div class="kpi-valor">${pAbert}</div></div><div class="kpi-card ${corTaxa(calcularTaxa(fPrev.length, pFech))}"><div class="kpi-label">Taxa</div><div class="kpi-valor">${calcularTaxa(fPrev.length, pFech)}%</div></div></div></div>
  `;
  conteudo.appendChild(divPainéis);

  // GRÁFICOS
  conteudo.innerHTML += `<div class="grafico-card"><div class="grafico-titulo">GRÁFICO GERAL</div><div class="grafico-wrap"><canvas id="grafico-geral"></canvas></div></div>`;
  conteudo.innerHTML += `<div class="grafico-card"><div class="grafico-titulo">GRÁFICO CORRETIVAS</div><div class="grafico-wrap"><canvas id="grafico-corretiva"></canvas></div></div>`;
  conteudo.innerHTML += `<div class="grafico-card"><div class="grafico-titulo">GRÁFICO PREVENTIVAS</div><div class="grafico-wrap"><canvas id="grafico-preventiva"></canvas></div></div>`;

  setTimeout(() => {
    const options = {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 30 } },
      plugins: {
        legend: { display: false },
        datalabels: { anchor: 'end', align: 'top', color: '#1a1a1a', font: { weight: 'bold', size: 14 } }
      },
      scales: { y: { beginAtZero: true }, x: { grid: { display: false } } }
    };

    const ctxG = document.getElementById("grafico-geral");
    if (ctxG) {
      if (GRAFICOS.geral) GRAFICOS.geral.destroy();
      GRAFICOS.geral = new Chart(ctxG, {
        type: "bar",
        data: { labels: ["Total", "Fechados", "Em Atendimento"], datasets: [{ data: [k.total, k.fechados, k.abertos], backgroundColor: ["#1B2A5C", "#16A34A", "#f97316"], borderRadius: 6 }] },
        options: options, plugins: [ChartDataLabels]
      });
    }

    const ctxC = document.getElementById("grafico-corretiva");
    if (ctxC) {
      if (GRAFICOS.corretiva) GRAFICOS.corretiva.destroy();
      GRAFICOS.corretiva = new Chart(ctxC, {
        type: "bar",
        data: { labels: ["Total", "Fechados", "Em Atendimento"], datasets: [{ data: [fCorr.length, cFech, cAbert], backgroundColor: ["#1B2A5C", "#16A34A", "#f97316"], borderRadius: 6 }] },
        options: options, plugins: [ChartDataLabels]
      });
    }

    const ctxP = document.getElementById("grafico-preventiva");
    if (ctxP) {
      if (GRAFICOS.preventiva) GRAFICOS.preventiva.destroy();
      GRAFICOS.preventiva = new Chart(ctxP, {
        type: "bar",
        data: { labels: ["Total", "Fechados", "Em Atendimento"], datasets: [{ data: [fPrev.length, pFech, pAbert], backgroundColor: ["#1B2A5C", "#16A34A", "#f97316"], borderRadius: 6 }] },
        options: options, plugins: [ChartDataLabels]
      });
    }
  }, 100);
}

// ============================================================
// GRID DE CATEGORIAS
// ============================================================
function renderizarGridCategorias() {
  const c = document.getElementById("conteudo");
  const grid = document.createElement("div");
  grid.className = "cat-grid";
  
  const cats = agruparPor(CHAMADOS_FILTRADOS, x => x.categoria)
    .filter(x => x.nome !== "PCM" && x.nome !== "Extras" && x.nome !== "Outros" && x.nome !== "Regionais")
    .sort((a, b) => a.nome.localeCompare(b.nome));

  cats.forEach(cat => {
    const cls = corTaxa(cat.taxa);
    const card = document.createElement("div");
    card.className = "cat-card " + cls;
    card.innerHTML = `
      <div class="cat-nome">${cat.nome}</div>
      <div class="cat-info-grid">
        <div class="cat-info"><div class="cat-info-label">Total</div><div class="cat-info-valor">${cat.total}</div></div>
        <div class="cat-info"><div class="cat-info-label">Fechados</div><div class="cat-info-valor">${cat.fechados}</div></div>
        <div class="cat-info"><div class="cat-info-label">Abertos</div><div class="cat-info-valor">${cat.abertos}</div></div>
      </div>
      <div class="cat-progresso">
        <span class="cat-progresso-label">Conclusão</span>
        <span class="badge ${cls}">${cat.taxa}%</span>
      </div>
    `;
    card.onclick = () => {
      const cont = document.getElementById("conteudo");
      Array.from(cont.children).forEach(el => { if (el.id !== "abas-container") el.remove(); });
      renderizarDetalheGenerico(cat.nome, CHAMADOS_FILTRADOS.filter(x => x.categoria === cat.nome), true);
    };
    grid.appendChild(card);
  });
  c.appendChild(grid);
}
// ============================================================
// LISTAS GENÉRICAS (Subgerentes, Regionais)
// ============================================================
function renderizarListaGenerica(titulo, dados, tipo) {
  const conteudo = document.getElementById("conteudo");
  
  const wrap = document.createElement("div");
  wrap.className = "filtro-data";
  wrap.innerHTML = `<label>Buscar:</label><input type="text" id="input-busca" value="${BUSCA_TEXTO}" placeholder="Nome..."><button id="btn-buscar">Buscar</button>`;
  conteudo.appendChild(wrap);
  document.getElementById("btn-buscar").onclick = () => { BUSCA_TEXTO = document.getElementById("input-busca").value; CHAMADOS_FILTRADOS = aplicarFiltros(TODOS_CHAMADOS); trocarAba(ABA_ATUAL); };

  conteudo.innerHTML += `<div class="section-title"><span>${titulo}</span><span class="tag">Ranking por Taxa</span></div>`;
  
  const tabela = document.createElement("table");
  tabela.className = "tabela";
  tabela.innerHTML = `
    <thead>
      <tr>
        <th>Rank</th>
        <th>Nome</th>
        <th class="num">Total (Corr+Prev)</th>
        <th class="num">Fechados</th>
        <th class="num">Abertos</th>
        <th class="taxa">Taxa</th>
      </tr>
    </thead>
    <tbody>
      ${dados.sort((a, b) => b.taxa - a.taxa).map((d, i) => {
        const cls = i === 0 ? "ouro" : i === 1 ? "prata" : i === 2 ? "bronze" : "";
        return `
          <tr>
            <td class="rank ${cls}">${medalha(i+1)}</td>
            <td><span class="nome-clicavel" data-nome="${d.nome}" data-tipo="${tipo}">${d.nome}</span></td>
            <td class="num">${d.total}</td>
            <td class="num">${d.fechados}</td>
            <td class="num">${d.abertos}</td>
            <td class="taxa"><span class="${corTaxa(d.taxa)}">${d.taxa}%</span></td>
          </tr>
        `;
      }).join("")}
    </tbody>
  `;
  conteudo.appendChild(tabela);

  conteudo.querySelectorAll("[data-nome]").forEach(el => {
    el.onclick = () => {
      const cont = document.getElementById("conteudo");
      Array.from(cont.children).forEach(x => { if (x.id !== "abas-container") x.remove(); });
      if (tipo === "subg") renderizarDetalheGenerico(el.dataset.nome, CHAMADOS_FILTRADOS.filter(c => c.subg === el.dataset.nome), true);
      if (tipo === "prest") renderizarDetalheGenerico(el.dataset.nome, CHAMADOS_FILTRADOS.filter(c => normalizar(c.atendente) === normalizar(el.dataset.nome)), false);
    };
  });
}

// ============================================================
// DETALHE GENÉRICO (Subgerente, Regional, Categoria, Prestador)
// ============================================================
function renderizarDetalheGenerico(titulo, filt, isGroup) {
  const conteudo = document.getElementById("conteudo");
  const btn = document.createElement("button");
  btn.className = "btn-voltar";
  btn.textContent = "← Voltar";
  btn.onclick = () => trocarAba(ABA_ATUAL);
  conteudo.appendChild(btn);
  
  conteudo.innerHTML += `<div class="detalhe-titulo">${titulo}</div>`;

  const fPrev = filt.filter(c => c.tipo === "preventiva");
  const fCorr = filt.filter(c => c.tipo === "corretiva");
  const t = filt.length;
  const f = filt.filter(c => c.statusCls === "fechado").length;
  const a = t - f;
  const tx = calcularTaxa(t, f);
  const pFech = fPrev.filter(c => c.statusCls === "fechado").length;
  const pAbert = fPrev.filter(c => c.statusCls === "aberto").length;
  const cFech = fCorr.filter(c => c.statusCls === "fechado").length;
  const cAbert = fCorr.filter(c => c.statusCls === "aberto").length;

  // Linha 1: Geral
  conteudo.innerHTML += `<div class="painel-bloco"><div class="painel-titulo geral">GERAL</div><div class="kpi-grid"><div class="kpi-card azul"><div class="kpi-label">Total</div><div class="kpi-valor">${t}</div></div><div class="kpi-card verde"><div class="kpi-label">Fechados</div><div class="kpi-valor">${f}</div></div><div class="kpi-card laranja"><div class="kpi-label">Em Atendimento</div><div class="kpi-valor">${a}</div></div><div class="kpi-card ${corTaxa(tx)}"><div class="kpi-label">Taxa</div><div class="kpi-valor">${tx}%</div></div></div></div>`;
  
  // Linha 2: Corretivas
  conteudo.innerHTML += `<div class="painel-bloco"><div class="painel-titulo corretiva">CORRETIVAS</div><div class="kpi-grid"><div class="kpi-card azul"><div class="kpi-label">Total</div><div class="kpi-valor">${fCorr.length}</div></div><div class="kpi-card verde"><div class="kpi-label">Fechados</div><div class="kpi-valor">${cFech}</div></div><div class="kpi-card laranja"><div class="kpi-label">Em Atendimento</div><div class="kpi-valor">${cAbert}</div></div><div class="kpi-card ${corTaxa(calcularTaxa(fCorr.length, cFech))}"><div class="kpi-label">Taxa</div><div class="kpi-valor">${calcularTaxa(fCorr.length, cFech)}%</div></div></div></div>`;
  
  // Linha 3: Preventivas
  conteudo.innerHTML += `<div class="painel-bloco"><div class="painel-titulo preventiva">PREVENTIVAS</div><div class="kpi-grid"><div class="kpi-card azul"><div class="kpi-label">Total</div><div class="kpi-valor">${fPrev.length}</div></div><div class="kpi-card verde"><div class="kpi-label">Fechados</div><div class="kpi-valor">${pFech}</div></div><div class="kpi-card laranja"><div class="kpi-label">Em Atendimento</div><div class="kpi-valor">${pAbert}</div></div><div class="kpi-card ${corTaxa(calcularTaxa(fPrev.length, pFech))}"><div class="kpi-label">Taxa</div><div class="kpi-valor">${calcularTaxa(fPrev.length, pFech)}%</div></div></div></div>`;

  // Tabela de Lojas (para prestadores)
  if (!isGroup && filt.length > 0) {
    const porLoja = new Map();
    filt.forEach(c => {
      if (!porLoja.has(c.lojaNorm)) porLoja.set(c.lojaNorm, { total: 0, abertos: 0 });
      const g = porLoja.get(c.lojaNorm);
      g.total++;
      if (c.statusCls === "aberto") g.abertos++;
    });
    const lojas = Array.from(porLoja.entries()).map(([loja, d]) => ({ loja, ...d })).sort((a, b) => b.total - a.total);

    if (lojas.length > 0) {
      const wrapLojas = document.createElement("div");
      wrapLojas.innerHTML = `
        <div class="bloco-lojas"><div class="bloco-titulo">Lojas que mais atende</div>${lojas.slice(0, 5).map(l => `<span class="loja-tag">Loja ${l.loja} • ${l.total}</span>`).join("")}</div>
        <div class="bloco-lojas"><div class="bloco-titulo">Lojas que menos atende</div>${lojas.slice(-5).reverse().map(l => `<span class="loja-tag">Loja ${l.loja} • ${l.total}</span>`).join("")}</div>
        <div class="bloco-lojas"><div class="bloco-titulo">Lojas com mais abertos</div>${lojas.filter(l => l.abertos > 0).slice(0, 5).map(l => `<span class="loja-tag aberto">Loja ${l.loja} • ${l.abertos}</span>`).join("")}</div>
      `;
      conteudo.appendChild(wrapLojas);
    }
  }

  // Tabela de Prestadores (para grupos)
  if (isGroup) {
    const prestadores = agruparPor(filt, c => c.atendente).sort((a, b) => b.taxa - a.taxa);
    const tabela = document.createElement("table");
    tabela.className = "tabela";
    tabela.innerHTML = `
      <thead>
        <tr>
          <th>Rank</th>
          <th>Prestador</th>
          <th>Categoria</th>
          <th class="num">Total (Corr+Prev)</th>
          <th class="num">Fechados</th>
          <th class="num">Abertos</th>
          <th class="taxa">Taxa</th>
        </tr>
      </thead>
      <tbody>
        ${prestadores.map((p, i) => {
          const cls = i === 0 ? "ouro" : i === 1 ? "prata" : i === 2 ? "bronze" : "";
          return `
            <tr>
              <td class="rank ${cls}">${medalha(i+1)}</td>
              <td><span class="nome-clicavel" data-prest="${p.nome}">${p.nome}</span></td>
              <td>${classificarAtendente(p.nome).cat}</td>
              <td class="num">${p.total}</td>
              <td class="num">${p.fechados}</td>
              <td class="num">${p.abertos}</td>
              <td class="taxa"><span class="${corTaxa(p.taxa)}">${p.taxa}%</span></td>
            </tr>
          `;
        }).join("")}
      </tbody>
    `;
    conteudo.appendChild(tabela);

    conteudo.querySelectorAll("[data-prest]").forEach(el => {
      el.onclick = () => {
        const cont = document.getElementById("conteudo");
        Array.from(cont.children).forEach(x => { if (x.id !== "abas-container") x.remove(); });
        renderizarDetalheGenerico(el.dataset.prest, CHAMADOS_FILTRADOS.filter(c => normalizar(c.atendente) === normalizar(el.dataset.prest)), false);
      };
    });
  }
}
